<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>📝 Daftar Tugas</h1>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Tulis tugas baru..." autocomplete="off">
      <button type="submit" id="add-btn">Tambah</button>
    </form>

    <div id="loading-state" class="state hidden">
      ⏳ Memuat data dari server...
    </div>

    <div id="error-state" class="state hidden">
      <p>❌ Gagal memuat data.</p>
      <button id="retry-btn">Coba Lagi</button>
    </div>

    <p id="empty-state" class="state hidden">Belum ada tugas. Tambahkan di atas!</p>

    <ul id="todo-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
